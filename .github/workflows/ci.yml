# SEC-13: third-party actions are pinned to immutable commit SHAs. Dependabot's
# weekly `github-actions` updates open reviewable PRs when an action is updated.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm sync-plan:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm traceability && git diff --exit-code docs/traceability.md
      - run: pnpm build

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  # SEC-01/SEC-02 merge gate: roles, migrations, RLS and tenant isolation against real Postgres 17 behind
  # PgBouncer in transaction mode (packages/db/docker). Runs twice on the same database to prove the suite
  # does not depend on a fresh volume. Required status check on `main` (P1 slice 2). Phase 1 later adds Playwright E2E.
  db-integration:
    name: Database roles, RLS and tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @platform/db generate
      - run: pnpm --filter @platform/db db:up
      - run: pnpm --filter @platform/db db:bootstrap
      - name: Bootstrap is idempotent
        run: pnpm --filter @platform/db db:bootstrap
      - run: pnpm --filter @platform/db db:migrate
      - name: Migrations and schema.prisma do not drift
        run: pnpm --filter @platform/db db:drift
      - name: Read-only deployment verification (same script as the live check)
        run: pnpm --filter @platform/db db:verify
      - name: Integration suite with coverage gate (NFR-MAINT-01)
        run: pnpm --filter @platform/db test:integration --coverage
      - name: Integration suite again on the now non-fresh database
        run: pnpm --filter @platform/db test:integration
      # SEC-02 merge gate (P1 slice 2): per-table cross-tenant matrix, row-factory registry and IDOR harness.
      - name: Cross-tenant isolation suite (tests/isolation)
        run: pnpm --filter @platform/isolation-tests test:isolation
      # Re-introduces seven isolation bugs one at a time; each must make the suite fail (proves it is not vacuous).
      - name: Isolation suite mutation check
        run: pnpm --filter @platform/isolation-tests test:mutation
      - name: Upload the per-table isolation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: isolation-report
          path: tests/isolation/results/
          if-no-files-found: warn
      - name: Database logs on failure
        if: failure()
        run: docker compose -f packages/db/docker/compose.yml logs --no-color --tail 300
