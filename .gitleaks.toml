title = "platform gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Throwaway credentials that only exist inside the local Docker stack of Spike B (never a real system)."
paths = [
  '''spikes/spike-b-rls-pooling/(db|src|test|prisma\.config\.ts|docker-compose\.yml)''',
  # git-ignored / generated directories: only relevant when scanning a working tree with --no-git
  '''(^|/)node_modules/''',
  '''(^|/)\.next/''',
  '''(^|/)\.turbo/''',
  '''(^|/)\.tmp/''',
]
