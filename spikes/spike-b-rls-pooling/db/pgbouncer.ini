[databases]
; main database: small pool so server connections are re-used heavily across tenants
spike = host=postgres port=5432 dbname=spike pool_size=2
; single-server-connection alias: makes the "session-level SET leaks" anti-pattern deterministic
spike_p1 = host=postgres port=5432 dbname=spike pool_size=1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 500
ignore_startup_parameters = extra_float_digits
admin_users = postgres
