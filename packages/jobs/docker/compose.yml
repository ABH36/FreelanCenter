# Local signed Inngest executor for the @platform/jobs integration suite (same image and mode as Spike G).
# `inngest start` runs the cloud executor locally and, unlike `inngest dev`, requires an event key and signs every
# request with the signing key, so the suite exercises the production SDK path. Both keys are generated per run by
# test/global-setup.ts and passed in the environment: none is stored in the repository.
name: platform-jobs
services:
  inngest:
    image: inngest/inngest:v1.46.0
    command:
      - inngest
      - start
      - --port=8288
      - --event-key=${JOBS_SUITE_EVENT_KEY:?generated by test/global-setup.ts}
      - --signing-key=${JOBS_SUITE_SIGNING_KEY:?generated by test/global-setup.ts}
    ports:
      - '127.0.0.1:8298:8288'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'bash', '-c', '</dev/tcp/127.0.0.1/8288']
      interval: 2s
      timeout: 3s
      retries: 30
