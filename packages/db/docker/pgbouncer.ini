[databases]
; Small pools so server connections are re-used heavily across tenants (that is what exposes context leaks).
platform = host=postgres port=5432 dbname=platform pool_size=4
; One server connection: used by the session-level SET anti-pattern test, which must observe the leak.
platform_p1 = host=postgres port=5432 dbname=platform pool_size=1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
; Local/CI only: ports bind to 127.0.0.1 and the data is synthetic (see compose.yml).
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
ignore_startup_parameters = extra_float_digits
