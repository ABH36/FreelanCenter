# Local and CI database stack for @platform/db (SRS 5.3, NFR-OPS-01).
# Postgres 17.11 (same major/minor as the live Supabase project) behind PgBouncer 1.25.2 in TRANSACTION mode,
# the pooler shape proven in Spike B. Images are pinned by digest (SEC-13).
#
# Authentication is `trust` and both ports bind to 127.0.0.1 only, so no password exists in this repository.
# The stack is for synthetic data only (DEVELOPMENT_ENVIRONMENT_POLICY.md).
#
# P1 S7: Redis behind serverless-redis-http (SRH), which speaks the Upstash REST API, so the host-resolution cache
# is tested over the same protocol apps/sites uses against Upstash. Its token is a fixed local value (port bound
# to 127.0.0.1, synthetic data), not a secret.
name: platform-db

services:
  postgres:
    image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:55440:5432'
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the socket: during initdb a temporary server listens on the socket only, then restarts.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d platform']
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 120s
      start_interval: 1s

  pgbouncer:
    image: edoburu/pgbouncer@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:56440:5432'
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432']
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 120s
      start_interval: 1s

  redis:
    image: redis:7.4-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  upstash-rest:
    image: hiett/serverless-redis-http@sha256:65128347949bca511e448fd7238780d624573d74c22b79155a7563db19e9b678
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-srh-token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - '127.0.0.1:58079:80'
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '80']
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 60s
      start_interval: 1s
